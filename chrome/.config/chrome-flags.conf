# Read by /usr/bin/google-chrome-stable. Hardware video decode via VA-API on NVIDIA
# (nvidia-vaapi-driver / NVDEC). Verified: VaapiVideoDecoder for H.264, VP9, HEVC.
--ozone-platform-hint=auto
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks
